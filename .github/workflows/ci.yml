name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package (no runtime dependencies)
        run: python -m pip install .
      - name: Syntax checks
        run: python -m compileall -q src tests scripts
      - name: Unit, integration, concurrency and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Demonstration
        run: python scripts/demo.py
      - name: Installed entrypoint
        run: ledgerflow --help
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: bandit -r src -q
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and non-root smoke test
        run: |
          docker build -t ledgerflow:ci .
          test "$(docker run --rm --entrypoint id ledgerflow:ci -u)" = "10001"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges ledgerflow:ci --help
