[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerflow-cdc"
version = "0.1.0"
description = "Transactional CDC reliability reference: contracts, replay safety, SCD2 and verified snapshots"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Maneesh Malepati"}]
keywords = ["data-engineering", "cdc", "scd2", "data-contracts", "sqlite"]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.4", "bandit==1.9.4", "coverage==7.10.6"]

[project.scripts]
ledgerflow = "ledgerflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["ledgerflow"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
